name: NCAAF 2026 season snapshot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ncaaf-2026-snapshot.yml"
  workflow_dispatch:
  schedule:
    - cron: "25 11 * * *"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install requests
      - name: Download completed 2026 NCAAF games
        run: python scripts/download_ncaaf_history.py --start 2026 --end 2026 --output data/ncaaf_2026_completed.csv
      - name: Validate season snapshot
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timezone
          with open("data/ncaaf_2026_completed.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert rows, "No completed games"
          assert all(r["season"] == "2026" for r in rows), "Wrong season"
          assert len({r["event_id"] for r in rows}) == len(rows), "Duplicate events"
          assert all(datetime.fromisoformat(r["date"].replace("Z", "+00:00")) <= datetime.now(timezone.utc) for r in rows), "Future game found"
          print(f"2026 completed games: {len(rows)}")
          print(f"First kickoff: {min(r['date'] for r in rows)}")
          print(f"Last kickoff: {max(r['date'] for r in rows)}")
          PY
      - name: Upload current season snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-2026-completed
          path: data/ncaaf_2026_completed.csv
          retention-days: 30
