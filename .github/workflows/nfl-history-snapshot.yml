name: NFL historical and current season snapshot
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/nfl-history-snapshot.yml"
  workflow_dispatch:
  schedule:
    - cron: "40 11 * * *"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install requests
      - name: Fetch historical NFL 2018-2025
        run: python scripts/download_nfl_history.py --start 2018 --end 2025 --output data/nfl_2018_2025.csv
      - name: Fetch completed NFL 2026
        run: python scripts/download_nfl_history.py --start 2026 --end 2026 --output data/nfl_2026_completed.csv
      - name: Validate outputs
        run: |
          python - <<'PY'
          import csv
          for filename, years in (("data/nfl_2018_2025.csv", set(range(2018, 2026))),
                                  ("data/nfl_2026_completed.csv", {2026})):
              with open(filename, newline="", encoding="utf-8") as f:
                  rows = list(csv.DictReader(f))
              assert rows, f"No rows: {filename}"
              assert {int(r["season"]) for r in rows}.issubset(years)
              assert len({r["event_id"] for r in rows}) == len(rows), "Duplicate event ID"
              print(f"{filename}: {len(rows)} completed games")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nfl-historical-and-2026
          path: |
            data/nfl_2018_2025.csv
            data/nfl_2026_completed.csv
          retention-days: 30
