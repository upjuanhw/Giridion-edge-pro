name: Quality gate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app.py historical_model.py season_data.py data_quality.py test_quality.py
      - run: python -m unittest discover -p "test_*.py" -v
      - run: python -c "import historical_model, season_data"
