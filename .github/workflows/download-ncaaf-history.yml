name: Download NCAAF historical scores
on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First season"
        required: true
        default: "2018"
        type: string
      end_year:
        description: "Last season"
        required: true
        default: "2025"
        type: string

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install requests
      - name: Validate year range
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          python - <<'PY'
          import os
          a, b = int(os.environ["START_YEAR"]), int(os.environ["END_YEAR"])
          assert 2000 <= a <= b <= 2030 and b - a <= 15, "Invalid year range"
          PY
      - name: Download completed games
        env:
          START_YEAR: ${{ inputs.start_year }}
          END_YEAR: ${{ inputs.end_year }}
        run: |
          python scripts/download_ncaaf_history.py --start "$START_YEAR" --end "$END_YEAR" --output data/ncaaf_games.csv
      - name: Validate CSV
        run: |
          python - <<'PY'
          import csv
          with open("data/ncaaf_games.csv", newline="", encoding="utf-8") as f:
              rows = list(csv.DictReader(f))
          assert rows, "Empty dataset"
          assert len({r["event_id"] for r in rows}) == len(rows), "Duplicate event IDs"
          years = sorted({r["season"] for r in rows})
          print(f"Validated {len(rows)} games across seasons: {', '.join(years)}")
          PY
      - name: Upload CSV artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ncaaf-historical-scores
          path: data/ncaaf_games.csv
          if-no-files-found: warn
          retention-days: 30
